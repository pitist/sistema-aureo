name: GitHub Script (comentarios automáticos)

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comentar en issues/PRs con github-script
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const event = context.eventName;
            const isIssue = event === 'issues';
            const number = isIssue ? context.issue.number : context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const message = isIssue
              ? '👋 ¡Gracias por abrir este issue! Revisaremos tu reporte pronto.'
              : '👋 ¡Gracias por tu Pull Request! Un revisor lo evaluará en breve.';

            await github.rest.issues.createComment({
              issue_number: number,
              owner,
              repo,
              body: message
            });
