name: Generic Test (funciona siempre)
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar información
        run: |
          echo "✅ GitHub Actions funcionando en ${{ github.repository }}"
          echo "📂 Contenido del repositorio:"
          ls -la
          echo "✅ Workflow ejecutado correctamente."
