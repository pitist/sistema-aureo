name: Verificar Secret

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar GH_PERSONAL_TOKEN
        run: |
          if [ -n "$GH_PERSONAL_TOKEN" ]; then
            echo "✅ GH_PERSONAL_TOKEN está configurado (longitud: ${#GH_PERSONAL_TOKEN})"
          else
            echo "❌ GH_PERSONAL_TOKEN NO está configurado"
            exit 1
          fi
        env:
          GH_PERSONAL_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
