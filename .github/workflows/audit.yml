name: Auditoría Android

on:
  push:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 auditor_completo.py .
      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: reporte_final.json
